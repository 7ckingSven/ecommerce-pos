<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Triple E &amp; Fiel Collins</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <a href="{{ url_for('landing') }}" class="nav-brand">
      <div class="nav-badge">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <span class="nav-brand-name">Triple E &amp; Fiel Collins</span>
    </a>
  </header>

  <div class="page-wrap">
    <div class="auth-card">

      <!-- Icon -->
      <div class="auth-icon-wrap">
        <div class="auth-icon-circle">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
      </div>

      <h2 class="auth-title">Reset Password</h2>
      <p class="auth-sub">OTP verified! Create your new password below.</p>

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="auth-alert {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <!-- Form -->
      <form method="POST" action="{{ url_for('reset_password') }}" onsubmit="return checkPasswords()">

        <!-- New Password -->
        <div class="auth-field">
          <label class="auth-label" for="password">New Password</label>
          <div class="auth-pass-wrap">
            <input
              type="password" id="password" name="password"
              class="auth-input"
              placeholder="Min. 8 characters"
              minlength="8" required
            />
            <button type="button" class="auth-eye-btn" onclick="togglePass('password')">
              <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="auth-field">
          <label class="auth-label" for="password_confirm">Confirm Password</label>
          <div class="auth-pass-wrap">
            <input
              type="password" id="password_confirm" name="password_confirm"
              class="auth-input"
              placeholder="Re-enter new password"
              minlength="8" required
              oninput="checkMatch()"
            />
            <button type="button" class="auth-eye-btn" onclick="togglePass('password_confirm')">
              <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="auth-mismatch" id="mismatch">Passwords do not match</p>
        </div>

        <button type="submit" class="auth-btn">Reset Password ✓</button>
      </form>

    </div>
  </div>

  <script>
    function togglePass(id) {
      const el = document.getElementById(id);
      el.type  = el.type === 'password' ? 'text' : 'password';
    }
    function checkMatch() {
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('password_confirm').value;
      document.getElementById('mismatch').style.display = p2 && p1 !== p2 ? 'block' : 'none';
    }
    function checkPasswords() {
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('password_confirm').value;
      if (p1 !== p2) { alert('Passwords do not match.'); return false; }
      return true;
    }
  </script>

</body>
</html>
