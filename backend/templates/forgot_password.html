<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password — Triple E &amp; Fiel Collins</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <a href="{{ url_for('landing') }}" class="nav-brand">
      <div class="nav-badge">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <span class="nav-brand-name">Triple E &amp; Fiel Collins</span>
    </a>
  </header>

  <div class="page-wrap">
    <div class="auth-card">

      <!-- Icon -->
      <div class="auth-icon-wrap">
        <div class="auth-icon-circle">
          <svg viewBox="0 0 24 24">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
      </div>

      <h2 class="auth-title">Forgot Password?</h2>
      <p class="auth-sub">Enter your registered email and we'll send you a 6-digit OTP to reset your password.</p>

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="auth-alert {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <!-- Form -->
      <form method="POST" action="{{ url_for('forgot_password') }}">
        <div class="auth-field">
          <label class="auth-label" for="email">Email Address</label>
          <input
            type="email" id="email" name="email"
            class="auth-input"
            placeholder="Enter your registered email"
            required autocomplete="email"
          />
        </div>
        <button type="submit" class="auth-btn">Send OTP</button>
      </form>

      <a href="{{ url_for('login') }}" class="auth-link">← Back to Login</a>

    </div>
  </div>

</body>
</html>
